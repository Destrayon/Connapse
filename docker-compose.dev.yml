# Development overrides — must be explicitly loaded alongside the base file.
# Exposes backing services to the host so `dotnet run` can connect directly.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  postgres:
    ports:
      - "5432:5432"
    networks:
      - frontend

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - frontend

  ollama:
    ports:
      - "11434:11434"
    networks:
      - frontend
    # Dev overrides for running larger LLMs locally on an NVIDIA GPU.
    # The base compose caps ollama at 4G memory (sized for the small embedding
    # model). Loading a 14B/27B LLM needs ~9-15G peak RAM during load + GPU
    # passthrough. Requires NVIDIA driver + Docker Desktop WSL2 backend.
    deploy:
      resources:
        limits:
          memory: 20G
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
