name: Mutation

# How many deliberate bugs the operations' tests catch (epic #783 Phase 2.5, CON-55). Stryker.NET plants
# small bugs (mutants) in Connapse.Application, runs Core.Tests' Small unit tests and the operations'
# Medium ones (the random-input tests under Application/, CON-89) against each one, and
# fails when the share it catches, the mutation score, is under the break threshold in
# tests/Connapse.Core.Tests/stryker-config.json. A workflow of its own, so its time doesn't count against
# ci.yml's six-minute pipeline budget. It runs on every PR into main or an epic branch, after every merge
# into an epic branch, every night on main (GitHub runs schedules only from the default branch), and on
# demand.
on:
  pull_request:
    branches: [ main, 'epic/**' ]
  push:
    branches: [ 'epic/**' ]
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR, or a newer merge into the same branch, replaces the run in progress: a full run
# holds a runner for about 11 minutes, and on the Free plan's 20 concurrent jobs those slots made CI queue
# behind it during mass rebases (CON-91).
concurrency:
  group: mutation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
# One Stryker job re-testing a PR's mutants one after another went from about 4 to 7 minutes as PRs moved
# endpoints into Connapse.Application, and a full run from 11 to 17 (CON-138). So `plan` splits the project's
# files into up to four shards of about the same number of mutants to test (mutation_shards.py), each shard runs
# Stryker on its own files in parallel (mutation-shard.yml), and the merged report is scored as one run's would be.
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      since: ${{ steps.plan.outputs.since }}
      partial: ${{ steps.plan.outputs.partial }}
      full: ${{ steps.plan.outputs.full }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # A PR checks out its merge commit; depth 2 brings in the merge commit's first parent, the base the
        # PR is diffed against below.
        fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

    - name: Find the PR's base commit
      id: base
      if: github.event_name == 'pull_request'
      run: echo "sha=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"

    # Every full run saves its report and commit as the baseline for PRs into its branch; a PR restores the
    # one saved at its base commit, or else the newest on its base branch (a PR can read its base branch's
    # caches), and diffs against the commit that baseline was made at, whichever it is.
    # A push run restores its branch's newest baseline too, only to weigh the shards by last run's mutants.
    - name: Restore mutation baseline
      uses: actions/cache/restore@v4
      with:
        path: mutation-baseline
        key: mutation-baseline-${{ github.base_ref || github.ref_name }}-${{ steps.base.outputs.sha || github.sha }}
        restore-keys: mutation-baseline-${{ github.base_ref || github.ref_name }}-

    # A PR with a baseline re-tests only the mutants in the files changed since the baseline's commit and those
    # its changed test files cover (--since), and mutation_score.py takes every other mutant's result from the
    # baseline, so the PR is still held to the whole project's score. Changes whose effect can't be bounded
    # (exit 3), or no baseline, make it a full run. Both plans are written: a partial run the baseline can't
    # settle falls back to the full one.
    - name: Plan the shards
      id: plan
      run: |
        baseline=mutation-baseline
        mkdir -p plan
        : > plan/changed-files.txt
        mode=full
        if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f "$baseline/commit" ] && commit=$(cat "$baseline/commit") \
            && git fetch --no-tags --depth=1 origin "$commit"; then
          git diff --name-status --no-renames "$commit" > plan/changed-files.txt
          status=0
          python3 .github/scripts/mutation_score.py --baseline "$baseline/mutation-report.json" \
            --config tests/Connapse.Core.Tests/stryker-config.json --changed plan/changed-files.txt \
            --repo-root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
          if [ "$status" -eq 0 ]; then
            mode=partial
            echo "since=$commit" >> "$GITHUB_OUTPUT"
            cp -r "$baseline" plan/
          elif [ "$status" -ne 3 ]; then
            exit "$status"
          fi
        fi
        plan() {
          python3 .github/scripts/mutation_shards.py plan --project-dir src/Connapse.Application \
            --repo-root "$GITHUB_WORKSPACE" --baseline "$baseline/mutation-report.json" \
            --changed plan/changed-files.txt --mode "$1" > "plan/$1.json"
          echo "$1=$(cat "plan/$1.json")" >> "$GITHUB_OUTPUT"
          echo "$1 run: $(jq -r '[.shards[].estimate] | "\(length) shard(s) of about \(join(", ")) mutants"' "plan/$1.json")" \
            | tee -a "$GITHUB_STEP_SUMMARY"
        }
        if [ "$mode" = partial ]; then
          plan partial
        else
          echo 'partial={"shards":[]}' >> "$GITHUB_OUTPUT"
          echo "Running every mutant" | tee -a "$GITHUB_STEP_SUMMARY"
        fi
        plan full
        echo "mode=$mode" >> "$GITHUB_OUTPUT"
      shell: bash  # -o pipefail, so the score's exit code survives the tee

    - uses: actions/upload-artifact@v4
      with:
        name: mutation-plan
        path: plan/
        if-no-files-found: error
        retention-days: 7

  partial-shards:
    needs: plan
    if: needs.plan.outputs.mode == 'partial'
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.partial).shards }}
    uses: ./.github/workflows/mutation-shard.yml
    with:
      stage: partial
      shard: ${{ toJSON(matrix.shard) }}
      since: ${{ needs.plan.outputs.since }}

  # The re-tested mutants' results with every other mutant's from the baseline. When the baseline can't settle
  # the score (exit 3), the full shards run.
  partial-score:
    needs: [plan, partial-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.score.outputs.status }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/scripts
          tests/Connapse.Core.Tests/stryker-config.json
        sparse-checkout-cone-mode: false

    - uses: actions/download-artifact@v4
      with:
        name: mutation-plan
        path: artifacts/mutation-plan

    - uses: actions/download-artifact@v4
      with:
        pattern: mutation-partial-shard-*
        path: artifacts

    - name: Score the merged shards
      id: score
      shell: bash
      run: |
        python3 .github/scripts/mutation_shards.py merge --plan artifacts/mutation-plan/partial.json \
          --reports artifacts --shard-prefix mutation-partial-shard- --out mutation-report.json
        status=0
        python3 .github/scripts/mutation_score.py --report mutation-report.json \
          --baseline artifacts/mutation-plan/mutation-baseline/mutation-report.json \
          --config tests/Connapse.Core.Tests/stryker-config.json --changed artifacts/mutation-plan/changed-files.txt \
          --repo-root "$GITHUB_WORKSPACE" | tee -a "$GITHUB_STEP_SUMMARY" || status=$?
        echo "status=$status" >> "$GITHUB_OUTPUT"
        if [ "$status" -eq 3 ]; then
          echo "Running every mutant" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        exit "$status"

    # A failing score still uploads its report; status is set only once the shards merged.
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && steps.score.outputs.status != '' }}
      with:
        name: mutation-report
        path: mutation-report.json
        if-no-files-found: error

  full-shards:
    needs: [plan, partial-score]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.plan.outputs.mode == 'full' || needs.partial-score.outputs.status == '3') }}
    strategy:
      fail-fast: true
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.full).shards }}
    uses: ./.github/workflows/mutation-shard.yml
    with:
      stage: full
      shard: ${{ toJSON(matrix.shard) }}

  # Every mutant's result, held to the same break threshold Stryker would apply, and saved as the baseline for
  # PRs into this branch even when the score fails: it is still every mutant's true result.
  full-score:
    needs: [plan, full-shards]
    if: ${{ !cancelled() && needs.full-shards.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        sparse-checkout: |
          .github/scripts
          tests/Connapse.Core.Tests/stryker-config.json
        sparse-checkout-cone-mode: false

    - uses: actions/download-artifact@v4
      with:
        name: mutation-plan
        path: artifacts/mutation-plan

    - uses: actions/download-artifact@v4
      with:
        pattern: mutation-full-shard-*
        path: artifacts

    - name: Merge the shards
      run: |
        python3 .github/scripts/mutation_shards.py merge --plan artifacts/mutation-plan/full.json \
          --reports artifacts --shard-prefix mutation-full-shard- --out mutation-report.json

    - name: Score every mutant
      id: score
      shell: bash
      run: |
        python3 .github/scripts/mutation_score.py --full --report mutation-report.json \
          --config tests/Connapse.Core.Tests/stryker-config.json | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Save mutation baseline
      if: ${{ !cancelled() && github.event_name != 'pull_request' && (steps.score.outcome == 'success' || steps.score.outcome == 'failure') }}
      run: |
        mkdir -p mutation-baseline
        cp mutation-report.json mutation-baseline/
        echo "${{ github.sha }}" > mutation-baseline/commit

    - uses: actions/cache/save@v4
      if: ${{ !cancelled() && github.event_name != 'pull_request' && (steps.score.outcome == 'success' || steps.score.outcome == 'failure') }}
      with:
        path: mutation-baseline
        key: mutation-baseline-${{ github.ref_name }}-${{ github.sha }}

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() && (steps.score.outcome == 'success' || steps.score.outcome == 'failure') }}
      with:
        name: mutation-report-full
        path: mutation-report.json
        if-no-files-found: error
