name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'epic/**' ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # GitHub runners have Docker pre-installed - Testcontainers will use it automatically
    # Ollama is installed directly on the runner for embedding generation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # The PDF models (layout #642, table structure #652) are downloaded by the Ingestion build into .models/; keyed
    # by their SHA-256 prefixes so a new model version downloads once and every other run restores it.
    - name: Cache layout model
      uses: actions/cache@v4
      with:
        path: .models
        key: pdf-models-250dbad1-d57a942a

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    # The unit tests lint every generated CloudShell script with bash -n and ShellCheck. The runner
    # image ships both, so this is normally a version print; installing it here rather than relying
    # on that means a future image dropping it costs a few seconds instead of a red build nobody can
    # explain. GeneratedScriptLintTests fails outright if ShellCheck is missing while CI is set.
    - name: Ensure ShellCheck is available
      run: shellcheck --version || sudo apt-get install -y shellcheck

    # Cache must be restored BEFORE Ollama is set up so the pulled model is available immediately
    - name: Cache Ollama models
      uses: actions/cache@v4
      with:
        path: ~/.ollama
        key: ${{ runner.os }}-ollama-nomic-embed-text-v1
        restore-keys: |
          ${{ runner.os }}-ollama-nomic-embed-text-
          ${{ runner.os }}-ollama-

    - name: Setup Ollama
      uses: ai-action/setup-ollama@v2

    - name: Start Ollama service
      run: |
        ollama serve &
        sleep 5

    - name: Pull embedding model
      run: |
        ollama pull nomic-embed-text
        ollama list

    # Tests run in three size tiers (epic #783, #788). Small is Category=Unit with no Size trait: no
    # Docker, no models, no child processes. Each tier writes its own TRX because TRX doesn't record
    # traits, and the budget step below reads them. The Small step's wall time is the fast gate's budget.
    # Each step records its wall time even when tests fail, so the budget check below still reports.
    - name: Run Small tests
      run: |
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration Release --filter "Category=Unit&Size!=Medium&Size!=Large" --verbosity normal --logger "trx;LogFileName=small-tests.trx"
        status=$?
        echo "SMALL_WALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        exit $status

    # Medium: slower unit tests, and integration tests on the shared PostgreSQL + MinIO pair
    # (SharedWebAppFixture) with Ollama on the host. Coverage is collected here, as before.
    - name: Run Medium tests
      if: success() || failure()
      run: |
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration Release --filter "(Category=Unit&Size=Medium)|(Category=Integration&Size!=Large)" --verbosity normal --logger "trx;LogFileName=medium-tests.trx" --collect:"XPlat Code Coverage"
        status=$?
        echo "MEDIUM_WALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        exit $status

    # Large: PDF and OCR models, inference and parser child processes, and the eval runners.
    - name: Run Large tests
      if: success() || failure()
      run: |
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration Release --filter "Size=Large" --verbosity normal --logger "trx;LogFileName=large-tests.trx" --collect:"XPlat Code Coverage"
        status=$?
        echo "LARGE_WALL_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
        exit $status

    # Every tier is checked even if another fails, and every test project must have reported.
    - name: Check test-speed budgets
      if: success() || failure()
      run: |
        rc=0
        python3 .github/scripts/test_budgets.py --tier Small --trx small-tests.trx --max-test-seconds 10 --wall-seconds "${SMALL_WALL_SECONDS:--1}" --max-wall-seconds 30 || rc=1
        python3 .github/scripts/test_budgets.py --tier Medium --trx medium-tests.trx --max-test-seconds 30 --wall-seconds "${MEDIUM_WALL_SECONDS:--1}" --max-wall-seconds 480 || rc=1
        python3 .github/scripts/test_budgets.py --tier Large --trx large-tests.trx --wall-seconds "${LARGE_WALL_SECONDS:--1}" --max-wall-seconds 600 || rc=1
        exit $rc

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: '**/*.trx'

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Generate test badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        # Parse pass/fail counts from TRX files
        PASSED=0
        FAILED=0
        for trx in $(find . -name '*.trx' -type f); do
          P=$(grep -oP 'passed="\K[0-9]+' "$trx" | head -1)
          F=$(grep -oP 'failed="\K[0-9]+' "$trx" | head -1)
          PASSED=$((PASSED + ${P:-0}))
          FAILED=$((FAILED + ${F:-0}))
        done
        TOTAL=$((PASSED + FAILED))

        if [ "$FAILED" -gt 0 ]; then
          MESSAGE="${PASSED}/${TOTAL} passing"
          COLOR="red"
        else
          MESSAGE="${PASSED} passing"
          COLOR="brightgreen"
        fi

        mkdir -p .badges
        echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}" > .badges/tests.json

    - name: Publish test badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        cd .badges
        git init --initial-branch badges
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests.json
        git commit -m "Update test badge"
        git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # The PDF models (layout #642, table structure #652) are downloaded by the Ingestion build into .models/; keyed
    # by their SHA-256 prefixes so a new model version downloads once and every other run restores it.
    - name: Cache layout model
      uses: actions/cache@v4
      with:
        path: .models
        key: pdf-models-250dbad1-d57a942a

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore
      continue-on-error: true

    - name: Run code analysis
      run: dotnet build --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true
      continue-on-error: true

  # The official MCP conformance suite in server mode (#793), against the app run with
  # `dotnet run` on throwaway Postgres and MinIO. The runner can't send credentials, so the
  # server allows anonymous MCP discovery; tool calls still need a key. Known failures are in
  # .github/mcp-conformance-baseline.yml, and a listed scenario that starts passing fails the job.
  mcp-conformance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache layout model
      uses: actions/cache@v4
      with:
        path: .models
        key: pdf-models-250dbad1-d57a942a

    - name: Start Postgres and MinIO
      run: |
        docker run -d --name conf-pg -e POSTGRES_USER=connapse -e POSTGRES_PASSWORD=connapse -e POSTGRES_DB=connapse -p 5432:5432 pgvector/pgvector:pg17
        docker run -d --name conf-minio -e MINIO_ROOT_USER=connapse -e MINIO_ROOT_PASSWORD=connapse_secret -p 9000:9000 cgr.dev/chainguard/minio server /data

    - name: Build
      run: dotnet build src/Connapse.Web --configuration Release

    - name: Start Connapse
      env:
        ASPNETCORE_URLS: http://localhost:5099
        ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=connapse;Username=connapse;Password=connapse
        Knowledge__Storage__MinIO__Endpoint: localhost:9000
        Knowledge__Storage__MinIO__AccessKey: connapse
        Knowledge__Storage__MinIO__SecretKey: connapse_secret
        Knowledge__Storage__MinIO__UseSSL: 'false'
        Identity__Jwt__Secret: conformance-jwt-secret-that-is-long-enough-for-hs256-signing!!
        Mcp__AllowAnonymousDiscovery: 'true'
      run: |
        dotnet run --project src/Connapse.Web --configuration Release --no-build --no-launch-profile > web.log 2>&1 &
        timeout 120 bash -c 'until curl -sf http://localhost:5099/health > /dev/null; do sleep 2; done' || { tail -50 web.log; exit 1; }

    - name: Run the MCP conformance suite
      run: npx -y @modelcontextprotocol/conformance@0.1.16 server --url http://localhost:5099/mcp --expected-failures .github/mcp-conformance-baseline.yml

    - name: Server log on failure
      if: failure()
      run: tail -100 web.log
