name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'epic/**' ]

permissions:
  contents: read

jobs:
  # Tests run in three size tiers (epic #783, #788), split into parallel jobs (#789). Small is
  # Category=Unit with no Size trait: no Docker, no models, no child processes. Medium is the slower
  # unit tests and the integration tests on the shared PostgreSQL + MinIO pair (SharedWebAppFixture)
  # with Ollama on the host; Integration.Tests, the long pole, runs as three class shards. Large runs
  # nightly (nightly.yml). Each job uploads its TRX files and its wall time; build-and-test, at the
  # end, checks the budgets and the whole pipeline's wall time.
  small:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/build

    - name: Run Small tests
      run: |
        mkdir -p walls
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration Release --filter "Category=Unit&Size!=Medium&Size!=Large" --verbosity normal --logger "trx;LogFileName=small-tests.trx"
        status=$?
        echo $(( $(date +%s) - start )) > walls/small.txt
        exit $status

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-small
        path: |
          **/TestResults/*.trx
          walls/

  # Medium for every project but Integration.Tests, which the integration shards run. Integration.Tests
  # still writes an empty medium-tests.trx here, so the budget check sees every project report.
  medium:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/build

    # The unit tests lint every generated CloudShell script with bash -n and ShellCheck. The runner
    # image ships both, so this is normally a version print; installing it here rather than relying
    # on that means a future image dropping it costs a few seconds instead of a red build nobody can
    # explain. GeneratedScriptLintTests fails outright if ShellCheck is missing while CI is set.
    - name: Ensure ShellCheck is available
      run: shellcheck --version || sudo apt-get install -y shellcheck

    - uses: ./.github/actions/ollama

    - name: Run Medium tests
      run: |
        mkdir -p walls
        start=$(date +%s)
        set +e
        dotnet test --no-build --configuration Release --filter "((Category=Unit&Size=Medium)|(Category=Integration&Size!=Large))&FullyQualifiedName!~Connapse.Integration.Tests." --verbosity normal --logger "trx;LogFileName=medium-tests.trx" --collect:"XPlat Code Coverage"
        status=$?
        echo $(( $(date +%s) - start )) > walls/medium.txt
        exit $status

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-medium
        path: |
          **/TestResults/*.trx
          walls/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Integration.Tests' Medium tier in three shards by test class. Each shard starts its own host and
  # containers; the last shard runs every class the others don't name (shard_tests.py).
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - uses: ./.github/actions/build

    - uses: ./.github/actions/ollama

    - name: Run Integration.Tests shard ${{ matrix.shard }} of 3
      run: |
        mkdir -p walls
        filter=$(python3 .github/scripts/shard_tests.py --project tests/Connapse.Integration.Tests --shards 3 --index ${{ matrix.shard }} \
          --filter "(Category=Unit&Size=Medium)|(Category=Integration&Size!=Large)")
        start=$(date +%s)
        set +e
        dotnet test tests/Connapse.Integration.Tests --no-build --configuration Release --filter "$filter" --verbosity normal --logger "trx;LogFileName=medium-tests-shard-${{ matrix.shard }}.trx" --collect:"XPlat Code Coverage"
        status=$?
        echo $(( $(date +%s) - start )) > walls/integration-${{ matrix.shard }}.txt
        exit $status

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-integration-${{ matrix.shard }}
        path: |
          tests/Connapse.Integration.Tests/TestResults/*.trx
          walls/

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: success()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Keeps the check name the repository already reports, and fails unless every test job passed.
  build-and-test:
    runs-on: ubuntu-latest
    needs: [small, medium, integration, code-quality, mcp-conformance]
    if: always()
    permissions:
      contents: write
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        pattern: test-results-*
        merge-multiple: true

    - name: Test jobs passed
      run: |
        echo "small=${{ needs.small.result }} medium=${{ needs.medium.result }} integration=${{ needs.integration.result }}"
        [ "${{ needs.small.result }}" = success ] && [ "${{ needs.medium.result }}" = success ] && [ "${{ needs.integration.result }}" = success ]

    # Every tier is checked even if another fails, and every test project must have reported. The
    # Medium tier's wall time is its slowest job's, since the jobs run side by side.
    - name: Check test-speed budgets
      if: success() || failure()
      run: |
        rc=0
        small=$(cat walls/small.txt 2>/dev/null || echo -1)
        medium=$(cat walls/medium.txt walls/integration-*.txt 2>/dev/null | sort -n | tail -1)
        python3 .github/scripts/test_budgets.py --tier Small --trx small-tests.trx --max-test-seconds 10 --wall-seconds "$small" --max-wall-seconds 30 || rc=1
        python3 .github/scripts/test_budgets.py --tier Medium --trx "medium-tests*.trx" --max-test-seconds 30 --wall-seconds "${medium:--1}" --max-wall-seconds 480 || rc=1
        exit $rc

    - name: PrPipeline_WallTimeUnder6Min
      if: success() || failure()
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/pipeline_wall.py --max-seconds 360 --exclude build-and-test

    - name: Generate test badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        # Parse pass/fail counts from TRX files
        PASSED=0
        FAILED=0
        for trx in $(find . -name '*.trx' -type f); do
          P=$(grep -oP 'passed="\K[0-9]+' "$trx" | head -1)
          F=$(grep -oP 'failed="\K[0-9]+' "$trx" | head -1)
          PASSED=$((PASSED + ${P:-0}))
          FAILED=$((FAILED + ${F:-0}))
        done
        TOTAL=$((PASSED + FAILED))

        if [ "$FAILED" -gt 0 ]; then
          MESSAGE="${PASSED}/${TOTAL} passing"
          COLOR="red"
        else
          MESSAGE="${PASSED} passing"
          COLOR="brightgreen"
        fi

        mkdir -p .badges
        echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"${MESSAGE}\",\"color\":\"${COLOR}\"}" > .badges/tests.json

    - name: Publish test badge
      if: always() && github.ref == 'refs/heads/main'
      run: |
        cd .badges
        git init --initial-branch badges
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add tests.json
        git commit -m "Update test badge"
        git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    # The PDF models (layout #642, table structure #652) are downloaded by the Ingestion build into .models/; keyed
    # by their SHA-256 prefixes so a new model version downloads once and every other run restores it.
    - name: Cache layout model
      uses: actions/cache@v4
      with:
        path: .models
        key: pdf-models-250dbad1-d57a942a

    - name: Restore dependencies
      run: dotnet restore

    - name: Check formatting
      run: dotnet format --verify-no-changes --no-restore
      continue-on-error: true

    - name: Run code analysis
      run: dotnet build --no-restore --configuration Release /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=true
      continue-on-error: true

  # The official MCP conformance suite in server mode (#793), against the app run with
  # `dotnet run` on throwaway Postgres and MinIO. The runner can't send credentials, so the
  # server allows anonymous MCP discovery; tool calls still need a key. Known failures are in
  # .github/mcp-conformance-baseline.yml, and a listed scenario that starts passing fails the job.
  mcp-conformance:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Cache layout model
      uses: actions/cache@v4
      with:
        path: .models
        key: pdf-models-250dbad1-d57a942a

    - name: Start Postgres and MinIO
      run: |
        docker run -d --name conf-pg -e POSTGRES_USER=connapse -e POSTGRES_PASSWORD=connapse -e POSTGRES_DB=connapse -p 5432:5432 pgvector/pgvector:pg17
        docker run -d --name conf-minio -e MINIO_ROOT_USER=connapse -e MINIO_ROOT_PASSWORD=connapse_secret -p 9000:9000 cgr.dev/chainguard/minio server /data

    - name: Build
      run: dotnet build src/Connapse.Web --configuration Release

    - name: Start Connapse
      env:
        ASPNETCORE_URLS: http://localhost:5099
        ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=connapse;Username=connapse;Password=connapse
        Knowledge__Storage__MinIO__Endpoint: localhost:9000
        Knowledge__Storage__MinIO__AccessKey: connapse
        Knowledge__Storage__MinIO__SecretKey: connapse_secret
        Knowledge__Storage__MinIO__UseSSL: 'false'
        Identity__Jwt__Secret: conformance-jwt-secret-that-is-long-enough-for-hs256-signing!!
        Mcp__AllowAnonymousDiscovery: 'true'
      run: |
        dotnet run --project src/Connapse.Web --configuration Release --no-build --no-launch-profile > web.log 2>&1 &
        timeout 120 bash -c 'until curl -sf http://localhost:5099/health > /dev/null; do sleep 2; done' || { tail -50 web.log; exit 1; }

    - name: Run the MCP conformance suite
      run: npx -y @modelcontextprotocol/conformance@0.1.16 server --url http://localhost:5099/mcp --expected-failures .github/mcp-conformance-baseline.yml

    - name: Server log on failure
      if: failure()
      run: tail -100 web.log
