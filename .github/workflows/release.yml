name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write   # needed to create GitHub Releases and upload assets
  packages: write   # needed to push Docker images to ghcr.io

jobs:
  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The server reports this version (CON-316). The Dockerfile fails the build if the published
      # assembly doesn't carry it, so an image that would say 0.0.0 is never pushed.
      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            0.0.0*|"") echo "::error::Tag $GITHUB_REF_NAME gives version '$version'"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/destrayon/connapse:${{ github.ref_name }}
            ghcr.io/destrayon/connapse:latest
          # No GitHub Actions layer cache (CON-351). A tag run can read only caches saved on its own tag or on main,
          # so each release saved about 5 GB that no later release could read (v0.4.2-alpha.1 reused no layers). That
          # pushed the repo past its 10 GB cache limit and evicted main's PDF model and NuGet caches, which every PR reads.

  # The file behind the one-command start: `docker compose -f oci://ghcr.io/destrayon/connapse:compose up -d -y`.
  # Each release pins its own image, because `latest` also moves on prereleases. The `compose` tag moves only
  # on a stable release. The name overlay keeps the project name `connapse` whichever folder someone runs from.
  publish-compose:
    name: Publish the compose file
    runs-on: ubuntu-latest
    needs: [build-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin this release's image
        run: sed -i 's/CONNAPSE_VERSION:-latest/CONNAPSE_VERSION:-${{ github.ref_name }}/' release/docker-compose.yml

      - name: Publish for this version
        run: docker compose -f release/docker-compose.yml -f release/compose-name.yml publish ghcr.io/destrayon/connapse:compose-${{ github.ref_name }} -y

      - name: Publish as the current stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: docker compose -f release/docker-compose.yml -f release/compose-name.yml publish ghcr.io/destrayon/connapse:compose -y

  package-release:
    name: Package release zip
    runs-on: ubuntu-latest
    needs: [build-docker]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          mkdir -p dist
          sed 's/CONNAPSE_VERSION:-latest/CONNAPSE_VERSION:-${{ github.ref_name }}/' release/docker-compose.yml > dist/docker-compose.yml
          cp release/.env.example dist/.env.example
          cp release/README.md dist/README.md
          cd dist
          zip ../connapse-docker-${{ github.ref_name }}.zip docker-compose.yml .env.example README.md
          cp docker-compose.yml ../docker-compose.yml

      - name: Upload release zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: connapse-docker
          path: |
            connapse-docker-${{ github.ref_name }}.zip
            docker-compose.yml
          retention-days: 1

      # The REST API's shape at this tag (#857). A tag can point at a commit CI never checked, so the
      # spec is generated from the tagged code and must match the committed copy before it ships.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Generate the OpenAPI spec
        run: dotnet build src/Connapse.Web -c Release

      - name: Check and stage the OpenAPI spec
        run: |
          if ! diff <(tr -d '\r' < docs/api/openapi.json) <(tr -d '\r' < src/Connapse.Web/obj/openapi/Connapse.Web.json) > /dev/null; then
            echo "::error::docs/api/openapi.json differs from the spec the tagged code generates. Run 'dotnet build src/Connapse.Web -p:UpdateOpenApiSpec=true' and commit it."
            exit 1
          fi
          cp src/Connapse.Web/obj/openapi/Connapse.Web.json connapse-openapi-${{ github.ref_name }}.json

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: connapse-openapi
          path: connapse-openapi-${{ github.ref_name }}.json
          retention-days: 1

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-release, publish-compose]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: connapse-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Docker (recommended)

            One command, with no file to edit (Compose 2.34 or later):

            ```bash
            docker compose -f oci://ghcr.io/destrayon/connapse:compose-${{ github.ref_name }} up -d -y
            ```

            With an older Compose, download `docker-compose.yml` from this release and run `docker compose up -d` next to it.

            Open [http://localhost:5001](http://localhost:5001) and create the Owner account.
            `connapse-docker-${{ github.ref_name }}.zip` holds the same file, an example `.env` and a `README.md`.

            **Docker image**: `ghcr.io/destrayon/connapse:${{ github.ref_name }}`

            ## REST API spec

            `connapse-openapi-${{ github.ref_name }}.json` is this release's OpenAPI 3.1 document.

            ## Connapse CLI

            The command-line client has moved to its own repository and
            versioning cadence. See [connapse-cli](https://github.com/Destrayon/connapse-cli)
            for install instructions and release downloads.
          files: release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
