services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: connapse
      POSTGRES_USER: connapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connapse -d connapse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  minio:
    # MinIO no longer publishes images to Docker Hub or Quay; Chainguard's build is maintained.
    # It runs as a non-root user by default, which cannot write /data (or read a volume the old
    # image wrote as root), so it runs as root like the image it replaces.
    image: cgr.dev/chainguard/minio
    user: "0"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollamadata:/root/.ollama
    profiles:
      - with-ollama
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  # Optional local reranker: a cross-encoder that re-scores the top search candidates. Start it with
  # `--profile with-reranker`, then set Search → Reranker to Cross-Encoder in Settings. For an NVIDIA
  # GPU, set RERANKER_IMAGE to a CUDA build (e.g. ghcr.io/huggingface/text-embeddings-inference:89-1.9
  # for RTX 40) and add a GPU reservation.
  reranker:
    image: ${RERANKER_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9}
    command: ["--model-id", "Alibaba-NLP/gte-reranker-modernbert-base", "--max-client-batch-size", "128"]
    volumes:
      - rerankerdata:/data
    profiles:
      - with-reranker
    # The model downloads from Hugging Face on first start; backend is internal (no internet).
    networks:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"

  web:
    image: ghcr.io/destrayon/connapse:${CONNAPSE_VERSION:-latest}
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=connapse;Username=connapse;Password=${POSTGRES_PASSWORD}"
      Knowledge__Storage__MinIO__Endpoint: "minio:9000"
      Knowledge__Storage__MinIO__AccessKey: "${MINIO_ROOT_USER}"
      Knowledge__Storage__MinIO__SecretKey: "${MINIO_ROOT_PASSWORD}"
      Knowledge__Storage__MinIO__UseSSL: "false"
      Knowledge__Embedding__BaseUrl: "${Knowledge__Embedding__BaseUrl:-http://ollama:11434}"
      Knowledge__Search__CrossEncoderBaseUrl: "${Knowledge__Search__CrossEncoderBaseUrl:-http://reranker:80}"
      CONNAPSE_ADMIN_EMAIL: ${CONNAPSE_ADMIN_EMAIL}
      CONNAPSE_ADMIN_PASSWORD: ${CONNAPSE_ADMIN_PASSWORD}
      Identity__Jwt__Secret: ${Identity__Jwt__Secret}
    volumes:
      - appdata:/app/appdata
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

volumes:
  pgdata:
  miniodata:
  ollamadata:
  rerankerdata:
  appdata:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
