services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: connapse
      POSTGRES_USER: connapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connapse_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U connapse -d connapse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-connapse_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-connapse_dev_secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
    volumes:
      - ollamadata:/root/.ollama
    profiles:
      - with-ollama
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

  web:
    build: .
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=connapse;Username=connapse;Password=${POSTGRES_PASSWORD:-connapse_dev}"
      Knowledge__Storage__MinIO__Endpoint: "minio:9000"
      Knowledge__Storage__MinIO__AccessKey: "${MINIO_ROOT_USER:-connapse_dev}"
      Knowledge__Storage__MinIO__SecretKey: "${MINIO_ROOT_PASSWORD:-connapse_dev_secret}"
      Knowledge__Storage__MinIO__UseSSL: "false"
      Knowledge__Embedding__BaseUrl: "http://ollama:11434"
      CONNAPSE_ADMIN_EMAIL: ${CONNAPSE_ADMIN_EMAIL:-}
      CONNAPSE_ADMIN_PASSWORD: ${CONNAPSE_ADMIN_PASSWORD:-}
      Identity__Jwt__Secret: ${Identity__Jwt__Secret:-}
    volumes:
      - appdata:/app/appdata

    # Lets an SFTP connection reach a machine by its short name — "fileserver" rather than
    # "fileserver.example.lan" or an address. Set CONNAPSE_DNS_SEARCH in .env to the DNS suffix
    # your network hands out; leave it unset and nothing changes.
    #
    # A workstation resolves the short name because its DNS client appends a connection-specific
    # suffix before asking. A container has no search domain — Docker Desktop stopped copying the
    # host's in 2.1.0.0 (docker/for-mac#3814) — so it looks up exactly what it was given.
    #
    # The ndots option is not optional here, and it is the part that is easy to get wrong. Docker
    # writes "options ndots:0" into the container, which tells the resolver every name is already
    # complete; the search list is then never consulted for a single-label name and dns_search on
    # its own does nothing. Measured: with a search domain and ndots:0 the short name still fails,
    # and with ndots:1 it resolves.
    dns_search: "${CONNAPSE_DNS_SEARCH:-}"
    dns_opt:
      - ndots:1

    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

volumes:
  pgdata:
  miniodata:
  ollamadata:
  appdata:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
